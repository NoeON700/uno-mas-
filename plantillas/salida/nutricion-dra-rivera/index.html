<script>
/* ============ QR (propio, sin librerías): modo byte, corrección M, versiones 1–10 ============ */
function qrMatriz(texto){
  const data=new TextEncoder().encode(texto);
  const T=[null,[10,[[1,16]]],[16,[[1,28]]],[26,[[1,44]]],[18,[[2,32]]],[24,[[2,43]]],[16,[[4,27]]],[18,[[4,31]]],[22,[[2,38],[2,39]]],[22,[[3,36],[2,37]]],[26,[[4,43],[1,44]]]];
  const AL=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  let v=1,cap=0;
  for(;v<=10;v++){cap=T[v][1].reduce((s,b)=>s+b[0]*b[1],0);if(4+(v<10?8:16)+data.length*8<=cap*8)break;}
  if(v>10)throw new Error('Texto demasiado largo para el QR');
  const bits=[];const push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1);};
  push(4,4);push(data.length,v<10?8:16);data.forEach(b=>push(b,8));
  push(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b);}
  for(let p=0xEC;cw.length<cap;p^=0xEC^0x11)cw.push(p);
  const EXP=new Uint8Array(512),LOG=new Uint8Array(256);let x=1;
  for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  const ecn=T[v][0];let g=[1];
  for(let i=0;i<ecn;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i]);}g=ng;}
  const rs=d=>{const r=new Array(ecn).fill(0);for(const b of d){const f=b^r.shift();r.push(0);for(let j=0;j<ecn;j++)r[j]^=mul(g[j+1],f);}return r;};
  const blocks=[];let pos=0;for(const [cnt,len] of T[v][1])for(let i=0;i<cnt;i++){const d=cw.slice(pos,pos+len);pos+=len;blocks.push([d,rs(d)]);}
  const out=[];const maxD=Math.max(...blocks.map(b=>b[0].length));
  for(let i=0;i<maxD;i++)for(const b of blocks)if(i<b[0].length)out.push(b[0][i]);
  for(let i=0;i<ecn;i++)for(const b of blocks)out.push(b[1][i]);
  const n=17+4*v,m=[],f=[];for(let i=0;i<n;i++){m.push(new Uint8Array(n));f.push(new Uint8Array(n));}
  const set=(xx,yy,d)=>{m[yy][xx]=d?1:0;f[yy][xx]=1;};
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx<0||yy<0||xx>=n||yy>=n)continue;const d=Math.max(Math.abs(dx),Math.abs(dy));set(xx,yy,d!==2&&d!==4);}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const al=AL[v];for(let i=0;i<al.length;i++)for(let j=0;j<al.length;j++){if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
  for(let i=0;i<n;i++){if(!f[6][i])set(i,6,i%2===0);if(!f[i][6])set(6,i,i%2===0);}
  const fmt=mask=>{let rem=mask;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);const b=((mask<<10)|rem)^0x5412;const bit=i=>(b>>>i)&1;
    for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));
    for(let i=0;i<8;i++)set(n-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,n-15+i,bit(i));set(8,n-8,1);};
  fmt(0);
  if(v>=7){let rem=v;for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);const b=(v<<12)|rem;for(let i=0;i<18;i++){const d=(b>>>i)&1,a=n-11+i%3,c=Math.floor(i/3);set(a,c,d);set(c,a,d);}}
  let k=0;const total=out.length*8;
  for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const xx=right-j,up=((right+1)&2)===0,yy=up?n-1-vert:vert;if(!f[yy][xx]&&k<total){m[yy][xx]=(out[k>>>3]>>>(7-(k&7)))&1;k++;}}}
  const MASK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const aplica=q=>{for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++)if(!f[yy][xx]&&MASK[q](xx,yy))m[yy][xx]^=1;};
  const pena=()=>{let p=0,dark=0;
    for(let a=0;a<n;a++)for(const horiz of [true,false]){let run=0,prev=-1,hist=0;for(let b=0;b<n;b++){const c=horiz?m[a][b]:m[b][a];if(c===prev){run++;if(run===5)p+=3;else if(run>5)p++;}else{run=1;prev=c;}hist=((hist<<1)|c)&0x7FF;if(b>=10&&(hist===0x5D0||hist===0x05D))p+=40;}}
    for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++){dark+=m[yy][xx];if(xx<n-1&&yy<n-1){const c=m[yy][xx];if(c===m[yy][xx+1]&&c===m[yy+1][xx]&&c===m[yy+1][xx+1])p+=3;}}
    return p+Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10;};
  let best=0,bestP=Infinity;for(let q=0;q<8;q++){aplica(q);fmt(q);const p=pena();if(p<bestP){bestP=p;best=q;}aplica(q);}
  aplica(best);fmt(best);
  return m;
}
function dibujaQR(ctx,texto,x,y,size,oscuro,ojo,claro){
  const M=qrMatriz(texto),n=M.length,S=size/n;
  const esOjo=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  const rr=(a,b,w,h,r)=>{ctx.beginPath();ctx.roundRect(a,b,w,h,r);ctx.fill();};
  ctx.fillStyle=oscuro;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(!M[r][c]||esOjo(r,c))continue;ctx.beginPath();ctx.arc(x+c*S+S/2,y+r*S+S/2,S*0.48,0,Math.PI*2);ctx.fill();}
  for(const [r,c] of [[0,0],[0,n-7],[n-7,0]]){const fx=x+c*S,fy=y+r*S;ctx.fillStyle=oscuro;rr(fx,fy,7*S,7*S,S);ctx.fillStyle=claro;rr(fx+S,fy+S,5*S,5*S,S*0.7);ctx.fillStyle=ojo;rr(fx+2*S,fy+2*S,3*S,3*S,S*0.5);}
}

  supabase:{url:"",clave:"",tabla:"registros"}};
function mezcla(a,b){if(Array.isArray(b)||b===null||typeof b!=='object')return b===undefined?a:b;const o={...a};for(const k of Object.keys(b))o[k]=(a&&typeof a[k]==='object'&&!Array.isArray(a[k])&&a[k]!==null)?mezcla(a[k],b[k]):b[k];return o;}

function lum(hex){const h=hex.replace('#','');const f=h.length===3?h.split('').map(c=>c+c).join(''):h;const [r,g,b]=[0,2,4].map(i=>parseInt(f.slice(i,i+2),16)/255).map(c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4));return 0.2126*r+0.7152*g+0.0722*b;}
const contraste=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);};
const sobre=hex=>contraste(hex,'#FFFFFF')>=contraste(hex,'#111111')?'#FFFFFF':'#111111';

  const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+fams+'&display=swap';document.head.appendChild(l);

/* ============ Descargas ============ */
function bajar(blob,nombre){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function pdfDe(jpeg,iw,ih){const pw=360,ph=Math.round(360*ih/iw),enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  push('%PDF-1.4\n');const cont=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`,null,`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`];
  objs.forEach((o,i)=>{offs[i]=len;push(`${i+1} 0 obj\n`);if(o===null){push(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);push(jpeg);push('\nendstream');}else push(o);push('\nendobj\n');});
  const xref=len;let x=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;offs.forEach(o=>{x+=String(o).padStart(10,'0')+' 00000 n \n';});
  push(x+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});}
const blobDe=(cv,tipo,q)=>new Promise(r=>cv.toBlob(r,tipo,q));
const slug=t=>String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'archivo';

/* ============ Registro ============ */
const R=C.registro,SB=C.supabase;let reg=null,guardado=false;
(function formulario(){if(!MOD.registro)return;$('registro').hidden=false;$('r-tit').textContent=R.titulo;$('r-intro').textContent=R.intro;$('r-enviar').textContent=R.boton;$('r-priv').textContent=R.privacidad||'';
  $('r-ok-tit').textContent=R.exitoTitulo;$('r-ok-msg').textContent=R.exitoMensaje;
  const caja=$('r-campos');const TIPOS={texto:'text',telefono:'tel',correo:'email',numero:'number',fecha:'date'};
  for(const c of R.campos){const id='c-'+c.id;let w;
    const marca=l=>{if(c.requerido){const s=el('span','req',' *');s.setAttribute('aria-hidden','true');l.appendChild(s);}};
    if(c.tipo==='casilla'){w=el('div','campo');const l=el('label','check');const i=el('input');i.type='checkbox';i.id=id;l.appendChild(i);l.appendChild(el('span',null,c.etiqueta));w.appendChild(l);}
    else if(c.tipo==='opciones'){w=el('fieldset','campo');const lg=el('legend',null,c.etiqueta);marca(lg);w.appendChild(lg);for(const o of c.opciones||[]){const l=el('label','check');const i=el('input');i.type='checkbox';i.name=id;i.value=o;l.appendChild(i);l.appendChild(el('span',null,o));w.appendChild(l);}}
    else{w=el('div','campo');const l=el('label',null,c.etiqueta);l.htmlFor=id;marca(l);w.appendChild(l);let i;
      if(c.tipo==='parrafo'){i=el('textarea');i.maxLength=c.max||500;}
      else if(c.tipo==='opcion'){i=el('select');i.appendChild(new Option('Elige una opción',''));for(const o of c.opciones||[])i.appendChild(new Option(o,o));}
      else{i=el('input');i.type=TIPOS[c.tipo]||'text';i.maxLength=c.max||(c.tipo==='telefono'?20:120);if(c.tipo==='telefono'){i.inputMode='tel';i.autocomplete='tel';}if(c.tipo==='correo')i.autocomplete='email';if(c.id==='nombre')i.autocomplete='name';}
      i.id=id;if(c.ayuda)i.placeholder=c.ayuda;if(c.requerido)i.setAttribute('aria-required','true');w.appendChild(i);}
    caja.appendChild(w);}
  if(!SB.url){const a=el('div','aviso ok','Modo demostración: este formulario todavía no guarda datos.');caja.parentElement.insertBefore(a,caja.parentElement.firstChild);}})();
function leer(){const vals={};for(const c of R.campos){const id='c-'+c.id;let v;
    if(c.tipo==='casilla')v=$(id).checked;else if(c.tipo==='opciones')v=[...document.querySelectorAll('input[name="'+id+'"]:checked')].map(i=>i.value);else v=$(id).value.trim();
    const vacio=v===''||v===false||(Array.isArray(v)&&!v.length);
    if(c.requerido&&vacio){return{error:c.tipo==='casilla'?'Marca la casilla: '+c.etiqueta:'Falta: '+c.etiqueta,foco:c.tipo==='opciones'?document.querySelector('input[name="'+id+'"]'):$(id)};}
    if(c.tipo==='correo'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return{error:'Revisa el correo.',foco:$(id)};
    if(c.tipo==='telefono'&&v&&v.replace(/\D/g,'').length<7)return{error:'Revisa el teléfono.',foco:$(id)};
    vals[c.id]=v;}
  return{vals};}
function folioNuevo(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(8));let s='';for(const x of b)s+=A[x%32];return s.slice(0,4)+'-'+s.slice(4);}
async function guardar(){if(!SB.url){guardado=true;return true;}
  const fijos=['nombre','telefono','email'];const datos={};for(const k of Object.keys(reg.vals))if(!fijos.includes(k))datos[k]=reg.vals[k];
  const fila={id:reg.id,folio:reg.folio,nombre:reg.vals.nombre||null,telefono:reg.vals.telefono||null,email:reg.vals.email||reg.vals.correo||null,datos};
  try{const r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/'+SB.tabla,{method:'POST',headers:{apikey:SB.clave,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(fila)});
    if(r.status===409){guardado=true;return true;} /* mismo id: ya estaba guardado (reintento) */
    if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());guardado=true;return true;}
  catch(e){console.error('No se pudo guardar',e);return false;}}
function estado(ok){$('r-guardado').hidden=!ok;$('r-fallo').hidden=ok;if(ok)$('r-guardado').textContent=SB.url?'Tu registro quedó guardado. Folio '+reg.folio:'Demostración: así se verá al guardar. Folio '+reg.folio;}
if(MOD.registro){
  $('r-form').addEventListener('submit',async e=>{e.preventDefault();const r=leer();if(r.error){$('r-err').textContent=r.error;r.foco&&r.foco.focus();return;}
    $('r-err').textContent='';reg={id:crypto.randomUUID(),folio:folioNuevo(),vals:r.vals,fecha:new Date()};guardado=false;
    const b=$('r-enviar');b.disabled=true;b.textContent='Guardando…';const ok=await guardar();b.disabled=false;b.textContent=R.boton;
    $('r-form-caja').hidden=true;$('r-listo').hidden=false;estado(ok);
    if(R.boleto.activo){$('r-boleto').hidden=false;await fuentes();boleto();}
    $('registro').scrollIntoView();});
  $('r-reintentar').addEventListener('click',async()=>{const b=$('r-reintentar');b.disabled=true;b.textContent='Guardando…';const ok=await guardar();b.disabled=false;b.textContent='Reintentar';estado(ok);});
  $('r-otro').addEventListener('click',()=>{$('r-form').reset();$('r-listo').hidden=true;$('r-form-caja').hidden=false;$('b-vista').hidden=true;$('b-msg').textContent='';$('registro').scrollIntoView();});
}
const fuentes=()=>Promise.all(['800 60px "'+C.tema.fuenteTitulos+'"','700 40px "'+C.tema.fuenteTitulos+'"','600 30px "'+C.tema.fuenteTexto+'"','500 30px "'+C.tema.fuenteTexto+'"'].map(f=>document.fonts.load(f))).catch(()=>{});

/* ============ Boleto (canvas 1080×1620) ============ */
function boleto(){const cv=$('r-canvas'),ctx=cv.getContext('2d'),W=1080,H=1620,T=C.tema,B=R.boleto;
  const FT='"'+T.fuenteTitulos+'", system-ui, sans-serif',FX='"'+T.fuenteTexto+'", system-ui, sans-serif';
  const pri=T.primario,spri=sobre(pri),papel='#FFFFFF',tinta='#16181D',gris='#5B616E';
  const ojo=contraste(pri,papel)>=3?pri:tinta;
  const cabe=(t,font,size,maxW,min)=>{let s=size;ctx.font=font.replace('{s}',s);while(ctx.measureText(t).width>maxW&&s>min){s-=2;ctx.font=font.replace('{s}',s);}return s;};
  const corta=(t,maxW)=>{if(ctx.measureText(t).width<=maxW)return t;let s=t;while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s.trimEnd()+'…';};
  ctx.clearRect(0,0,W,H);ctx.fillStyle=papel;ctx.fillRect(0,0,W,H);
  const hh=430;ctx.fillStyle=pri;ctx.fillRect(0,0,W,hh);
  ctx.fillStyle=spri;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  cabe(N.nombre.toUpperCase(),'700 {s}px '+FX,30,W-160,20);try{ctx.letterSpacing='4px';}catch(e){}ctx.fillText(N.nombre.toUpperCase(),80,110);try{ctx.letterSpacing='0px';}catch(e){}
  cabe(B.titulo||R.titulo,'800 {s}px '+FT,86,W-160,44);ctx.fillText(B.titulo||R.titulo,80,250);
  if(B.subtitulo){ctx.font='500 34px '+FX;ctx.fillText(corta(B.subtitulo,W-160),80,320);}
  /* muescas de boleto */
  ctx.fillStyle=papel;for(const x of [0,W]){ctx.beginPath();ctx.arc(x,hh,34,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=3;ctx.setLineDash([14,14]);ctx.beginPath();ctx.moveTo(60,hh);ctx.lineTo(W-60,hh);ctx.stroke();ctx.setLineDash([]);
  /* titular */
  let y=hh+90;ctx.fillStyle=gris;ctx.font='700 24px '+FX;try{ctx.letterSpacing='3px';}catch(e){}ctx.fillText('A NOMBRE DE',80,y);try{ctx.letterSpacing='0px';}catch(e){}
  const nom=String(reg.vals.nombre||'Invitado');ctx.fillStyle=tinta;cabe(nom,'800 {s}px '+FT,70,W-160,36);y+=78;ctx.fillText(corta(nom,W-160),80,y);
  /* datos extra */
  const extra=(B.mostrar||[]).map(id=>{const c=R.campos.find(k=>k.id===id);let v=reg.vals[id];if(!c||v===''||v==null||v===false)return null;if(Array.isArray(v))v=v.join(', ');if(v===true)v='Sí';return[c.etiqueta.replace(/[¿?:]/g,'').trim(),String(v)];}).filter(Boolean).slice(0,4);
  y+=44;const dosCol=extra.length>2,cw=dosCol?440:W-160;extra.forEach(([k,v],i)=>{const ex=80+(dosCol?(i%2)*480:0),ey=y+(dosCol?Math.floor(i/2):i)*100;ctx.fillStyle=gris;ctx.font='700 22px '+FX;ctx.fillText(corta(k.toUpperCase(),cw),ex,ey+26);ctx.fillStyle=tinta;ctx.font='600 34px '+FX;ctx.fillText(corta(v,cw),ex,ey+70);});
  /* QR */
  const qs=440,qx=(W-qs)/2,qy=H-qs-250;
  ctx.fillStyle='#F3F4F6';ctx.beginPath();ctx.roundRect(qx-40,qy-40,qs+80,qs+80,40);ctx.fill();
  dibujaQR(ctx,reg.id,qx,qy,qs,tinta,ojo,'#F3F4F6');
  ctx.textAlign='center';ctx.fillStyle=tinta;ctx.font='800 44px '+FX;try{ctx.letterSpacing='6px';}catch(e){}ctx.fillText(reg.folio,W/2,qy+qs+110);try{ctx.letterSpacing='0px';}catch(e){}
  ctx.fillStyle=gris;ctx.font='500 26px '+FX;const f=reg.fecha.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  ctx.fillText(corta([B.pie,f].filter(Boolean).join('  ·  '),W-120),W/2,H-70);
  $('r-canvas').setAttribute('aria-label','Boleto de '+nom+', folio '+reg.folio);}
if(MOD.registro){const cv=$('r-canvas');const nombre=ext=>slug(N.nombre)+'-'+(reg?reg.folio:'boleto')+'.'+ext;
  const vista=()=>{const i=$('b-vista');i.src=cv.toDataURL('image/png');i.hidden=false;};
  $('b-pdf').addEventListener('click',async()=>{const b=$('b-pdf');b.disabled=true;try{await fuentes();boleto();const j=new Uint8Array(await(await blobDe(cv,'image/jpeg',0.93)).arrayBuffer());bajar(pdfDe(j,cv.width,cv.height),nombre('pdf'));$('b-msg').textContent='Listo, revisa tus descargas.';}catch(e){$('b-msg').textContent='No se pudo crear el PDF. Mantén presionada la imagen para guardarla.';vista();}finally{b.disabled=false;}});
  $('b-img').addEventListener('click',async()=>{await fuentes();boleto();try{bajar(await blobDe(cv,'image/png'),nombre('png'));}catch(e){}vista();$('b-msg').textContent='Si no se descargó, mantén presionada la imagen para guardarla.';});
  $('b-print').addEventListener('click',async()=>{await fuentes();boleto();const p=$('printimg');p.onload=()=>{p.onload=null;window.print();};p.src=cv.toDataURL('image/png');});}

/* ============ QR de la página ============ */
(function qrPagina(){const pinta=()=>{const s=$('qr');const on=location.hash==='#qr';s.hidden=!on;if(!on)return;const cv=$('qr-canvas'),ctx=cv.getContext('2d');const url=location.origin+location.pathname;
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,900,900);const ojo=contraste(C.tema.primario,'#FFFFFF')>=3?C.tema.primario:'#16181D';
    try{dibujaQR(ctx,url,80,80,740,'#16181D',ojo,'#FFFFFF');}catch(e){ctx.fillStyle='#16181D';ctx.font='600 30px system-ui';ctx.fillText('La dirección es demasiado larga para el QR.',60,450);}
    s.scrollIntoView();};
  window.addEventListener('hashchange',pinta);pinta();
  $('qr-dl').addEventListener('click',async()=>{bajar(await blobDe($('qr-canvas'),'image/png'),'QR-'+slug(N.nombre)+'.png');});})();
